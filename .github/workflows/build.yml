name: Build LocalVoice
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - shell: powershell
        run: .\scripts\Build-Windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: LocalVoice-Windows
          path: release/windows/*
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: bash scripts/Build-Linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: LocalVoice-Linux
          path: release/linux/*
