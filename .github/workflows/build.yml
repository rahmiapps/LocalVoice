name: Build LocalVoice

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Build Windows packages
        shell: powershell
        run: .\scripts\Build-Windows.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: LocalVoice-Windows
          path: release/windows/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Build Linux packages
        run: bash scripts/Build-Linux.sh

      - uses: actions/upload-artifact@v7
        with:
          name: LocalVoice-Linux
          path: release/linux/*
          if-no-files-found: error
