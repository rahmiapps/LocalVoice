name: Build LocalVoice

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Build Windows packages
        shell: powershell
        run: .\scripts\Build-Windows.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: LocalVoice-Windows
          path: release/windows/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             python3-venv             portaudio19-dev             libportaudio2             libasound2-dev             libxcb-xinerama0             libxcb-cursor0             libxkbcommon-x11-0             libgl1             libegl1             libdbus-1-3             desktop-file-utils             patchelf             fakeroot             dpkg-dev             zsync             file

      - name: Build Linux packages
        run: bash scripts/Build-Linux.sh

      - uses: actions/upload-artifact@v7
        with:
          name: LocalVoice-Linux
          path: release/linux/*
          if-no-files-found: error
