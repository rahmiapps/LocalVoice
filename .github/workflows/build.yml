name: Build LocalVoice

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Build Windows packages
        shell: powershell
        run: .\scripts\Build-Windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: LocalVoice-Windows
          path: |
            release/windows/LocalVoice-Setup-Windows-x64.exe
            release/windows/LocalVoice-Windows-x64-Portable.zip
            release/windows/SHA256SUMS-Windows.txt
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Linux system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-venv \
            portaudio19-dev \
            libportaudio2 \
            libasound2-dev \
            libxcb-xinerama0 \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libgl1 \
            libegl1 \
            libdbus-1-3 \
            desktop-file-utils \
            patchelf \
            fakeroot \
            dpkg-dev \
            zsync \
            file
      - name: Build slim Linux packages
        shell: bash
        run: bash scripts/Build-Linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: LocalVoice-Linux
          path: |
            release/linux/LocalVoice-Linux-x86_64.AppImage
            release/linux/LocalVoice-Linux-amd64.deb
            release/linux/LocalVoice-Linux-x64-Portable.tar.gz
            release/linux/SHA256SUMS-Linux.txt
          if-no-files-found: error
