name: Bug report
description: Report a reproducible LocalVoice problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not upload private recordings, transcripts, keys, PINs or sensitive logs.
  - type: input
    id: version
    attributes:
      label: LocalVoice version
      placeholder: 2.1.1
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Linux X11
        - Linux Wayland
        - Other
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Speech model
      placeholder: Small / Medium / Large / not installed
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem without including private content.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Press ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional information
