[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localvoice"
version = "2.1.1"
description = "Private offline speech-to-text and translation for Windows and Linux"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [{name = "Rahmi Apps"}]
dependencies = [
  "PySide6>=6.8,<7",
  "sounddevice>=0.5,<1",
  "numpy>=2,<3",
  "faster-whisper>=1.1,<2",
  "argostranslate>=1.11,<2",
  "pynput>=1.7,<2",
  "cryptography>=48.0.1,<50",
  "platformdirs>=4,<5",
  "psutil>=6,<8",
  "keyring>=25,<27",
  "dbus-next>=0.2,<1",
]

[project.scripts]
localvoice = "localvoice.app:main"

[tool.setuptools.packages.find]
include = ["localvoice*"]
